openapi: 3.1.0
info:
  title: AegisIaC MVP API
  version: 0.1.0
  description: REST contract for the M0 plan-run, graph, AI review, and approval workflow.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: PlanRuns
  - name: Artifacts
  - name: AI
  - name: Graph
  - name: Approvals
paths:
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Projects visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
  /plan-runs:
    get:
      tags: [PlanRuns]
      operationId: listPlanRuns
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PlanRunStatus"
      responses:
        "200":
          description: Plan runs visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunListEnvelope"
    post:
      tags: [PlanRuns]
      operationId: createPlanRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRunRequest"
      responses:
        "201":
          description: Plan run created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunEnvelope"
  /plan-runs/{planRunId}:
    get:
      tags: [PlanRuns]
      operationId: getPlanRun
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      responses:
        "200":
          description: Plan run details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunEnvelope"
    patch:
      tags: [PlanRuns]
      operationId: updatePlanRun
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRunRequest"
      responses:
        "200":
          description: Plan run updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunEnvelope"
  /plan-runs/{planRunId}/terraform-plan:
    put:
      tags: [PlanRuns]
      operationId: uploadTerraformPlan
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadTerraformPlanRequest"
      responses:
        "200":
          description: Terraform plan accepted and normalized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunEnvelope"
  /plan-runs/{planRunId}/artifacts:
    get:
      tags: [Artifacts]
      operationId: listPlanArtifacts
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      responses:
        "200":
          description: Artifacts for a plan run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListEnvelope"
    post:
      tags: [Artifacts]
      operationId: createPlanArtifact
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanArtifactRequest"
      responses:
        "201":
          description: Artifact registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactEnvelope"
  /ai/configs:
    post:
      tags: [AI]
      operationId: createAiReviewConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiReviewConfigRequest"
      responses:
        "201":
          description: AI review config created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewConfigEnvelope"
  /plan-runs/{planRunId}/ai-review:
    get:
      tags: [AI]
      operationId: getAiReview
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      responses:
        "200":
          description: Latest AI review result for a plan run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewResultEnvelope"
    post:
      tags: [AI]
      operationId: startAiReview
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAiReviewRequest"
      responses:
        "202":
          description: AI review queued or started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewResultEnvelope"
  /plan-runs/{planRunId}/graph:
    get:
      tags: [Graph]
      operationId: getPlanRunGraph
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      responses:
        "200":
          description: Infrastructure graph DTO for the plan run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEnvelope"
  /plan-runs/{planRunId}/approvals:
    post:
      tags: [Approvals]
      operationId: requestApplyApproval
      parameters:
        - $ref: "#/components/parameters/PlanRunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplyApprovalRequest"
      responses:
        "201":
          description: Apply approval requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyApprovalEnvelope"
  /approvals/{approvalId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApplyApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApplyApprovalRequest"
      responses:
        "200":
          description: Apply approval decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyApprovalEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanRunId:
      name: planRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        metadata:
          type: object
          additionalProperties: true
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [ok, error, requestId]
      properties:
        ok:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ApiError"
        requestId:
          type: string
    Project:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$"
        description:
          type: string
    PlanRunStatus:
      type: string
      enum: [queued, planning, planned, reviewing, needs-approval, approved, applying, applied, failed, cancelled]
    PlanRun:
      type: object
      required: [id, projectId, source, status, cliArgs, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        repositoryId:
          type: string
          format: uuid
        source:
          type: string
          enum: [api, cli, github, scheduler]
        status:
          $ref: "#/components/schemas/PlanRunStatus"
        branch:
          type: string
        commitSha:
          type: string
        terraformVersion:
          type: string
        cliArgs:
          type: array
          items:
            type: string
        summary:
          $ref: "#/components/schemas/TerraformPlanSummary"
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    CreatePlanRunRequest:
      type: object
      required: [projectId, source]
      properties:
        projectId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        repositoryId:
          type: string
          format: uuid
        source:
          type: string
          enum: [api, cli, github, scheduler]
        branch:
          type: string
        commitSha:
          type: string
        terraformVersion:
          type: string
        cliArgs:
          type: array
          items:
            type: string
        variables:
          type: object
          additionalProperties: true
    UpdatePlanRunRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PlanRunStatus"
        terraformVersion:
          type: string
        summary:
          $ref: "#/components/schemas/TerraformPlanSummary"
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    TerraformPlanSummary:
      type: object
      required: [add, change, destroy, read, noOp]
      properties:
        add:
          type: integer
          minimum: 0
        change:
          type: integer
          minimum: 0
        destroy:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        noOp:
          type: integer
          minimum: 0
    UploadTerraformPlanRequest:
      type: object
      required: [planRunId, plan]
      properties:
        planRunId:
          type: string
          format: uuid
        plan:
          $ref: "#/components/schemas/TerraformPlanSubset"
        artifact:
          $ref: "#/components/schemas/CreatePlanArtifactRequest"
    TerraformPlanSubset:
      type: object
      required: [formatVersion, terraformVersion, resourceChanges]
      properties:
        formatVersion:
          type: string
          const: "1.0"
        terraformVersion:
          type: string
        resourceChanges:
          type: array
          items:
            $ref: "#/components/schemas/TerraformResourceChange"
        outputChanges:
          type: array
          items:
            type: object
            additionalProperties: true
        variables:
          type: object
          additionalProperties: true
    TerraformResourceChange:
      type: object
      required: [address, mode, type, name, providerName, change]
      properties:
        address:
          type: string
        moduleAddress:
          type: string
        mode:
          type: string
          enum: [managed, data]
        type:
          type: string
        name:
          type: string
        providerName:
          type: string
        index:
          oneOf:
            - type: string
            - type: number
        change:
          type: object
          required: [actions]
          properties:
            actions:
              type: array
              items:
                type: string
                enum: [no-op, create, read, update, delete]
            before: {}
            after: {}
            afterUnknown: {}
            beforeSensitive: {}
            afterSensitive: {}
            replacePaths:
              type: array
              items:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: number
    PlanArtifact:
      type: object
      required: [id, planRunId, kind, storageBucket, storagePath, createdAt]
      properties:
        id:
          type: string
          format: uuid
        planRunId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [plan-json, plan-binary, stdout, stderr, lockfile]
        storageBucket:
          type: string
        storagePath:
          type: string
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        byteSize:
          type: integer
          minimum: 0
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
    CreatePlanArtifactRequest:
      type: object
      required: [planRunId, kind, storageBucket, storagePath]
      properties:
        planRunId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [plan-json, plan-binary, stdout, stderr, lockfile]
        storageBucket:
          type: string
        storagePath:
          type: string
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        byteSize:
          type: integer
          minimum: 0
        contentType:
          type: string
    AiReviewConfig:
      type: object
      required: [id, projectId, name, provider, model, enabled, promptVersion, settings, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum: [openai, anthropic, azure-openai, local, other]
        model:
          type: string
        enabled:
          type: boolean
        promptVersion:
          type: string
        settings:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAiReviewConfigRequest:
      type: object
      required: [projectId, name, provider, model]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum: [openai, anthropic, azure-openai, local, other]
        model:
          type: string
        promptVersion:
          type: string
        settings:
          type: object
          additionalProperties: true
    StartAiReviewRequest:
      type: object
      properties:
        configId:
          type: string
          format: uuid
        inlineConfig:
          $ref: "#/components/schemas/CreateAiReviewConfigRequest"
    AiReviewResult:
      type: object
      required: [id, planRunId, status, findings, createdAt]
      properties:
        id:
          type: string
          format: uuid
        planRunId:
          type: string
          format: uuid
        configId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        riskScore:
          type: number
          minimum: 0
          maximum: 100
        summary:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/AiFinding"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    AiFinding:
      type: object
      required: [id, severity, category, title, description]
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        category:
          type: string
          enum: [cost, security, reliability, compliance, operational, drift, unknown]
        title:
          type: string
        description:
          type: string
        resourceAddress:
          type: string
        recommendation:
          type: string
    Graph:
      type: object
      required: [planRunId, formatVersion, nodes, edges, generatedAt]
      properties:
        planRunId:
          type: string
          format: uuid
        formatVersion:
          type: string
          const: "1.0"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        generatedAt:
          type: string
          format: date-time
    GraphNode:
      type: object
      required: [id, kind, label]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [project, workspace, module, resource, data-source, provider, output]
        label:
          type: string
        address:
          type: string
        metadata:
          type: object
          additionalProperties: true
    GraphEdge:
      type: object
      required: [id, kind, source, target]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [contains, depends-on, provides, reads, writes, changes]
        source:
          type: string
        target:
          type: string
        metadata:
          type: object
          additionalProperties: true
    ApplyApproval:
      type: object
      required: [id, planRunId, status, requestedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        planRunId:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested, approved, rejected, expired, cancelled]
        requestedBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateApplyApprovalRequest:
      type: object
      properties:
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
    DecideApplyApprovalRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
    ProjectEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Project"
    ProjectListEnvelope:
      allOf:
        - $ref: "#/components/schemas/ListEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Project"
    PlanRunEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/PlanRun"
    PlanRunListEnvelope:
      allOf:
        - $ref: "#/components/schemas/ListEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PlanRun"
    ArtifactEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/PlanArtifact"
    ArtifactListEnvelope:
      allOf:
        - $ref: "#/components/schemas/ListEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PlanArtifact"
    AiReviewConfigEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AiReviewConfig"
    AiReviewResultEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AiReviewResult"
    GraphEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Graph"
    ApplyApprovalEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ApplyApproval"
    SuccessEnvelopeBase:
      type: object
      required: [ok, requestId]
      properties:
        ok:
          type: boolean
          const: true
        requestId:
          type: string
    ListEnvelopeBase:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelopeBase"
        - type: object
          required: [page]
          properties:
            page:
              $ref: "#/components/schemas/PageInfo"
